<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="40%" stop-color="#0c102b"/>
      <stop offset="70%" stop-color="#0a1a36"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef"/>
      <stop offset="100%" stop-color="#7579ff"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-4deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.18); }
      }
      @keyframes driftPoints {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmer {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
      .orb-cyan { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-purple { animation: pulseOrb 8s ease-in-out infinite 1s; transform-origin: 1000px 300px; }
      .orb-pink { animation: pulseOrb 6s ease-in-out infinite 2s; transform-origin: 600px 380px; }
      .card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .card-2 { animation: floatReverse 7s ease-in-out infinite 0.5s; }
      .card-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .card-4 { animation: floatReverse 6.5s ease-in-out infinite 1.5s; }
      .cloud-dots { animation: driftPoints 5s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: dashFlow 4s linear infinite; }
      .tag-shimmer { animation: shimmer 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Ambient Glow Orbs in Background -->
  <circle cx="180" cy="120" r="140" fill="#38bdf8" filter="url(#glowCyan)" class="orb-cyan" opacity="0.25"/>
  <circle cx="1020" cy="300" r="160" fill="#8b5cf6" filter="url(#glowPurple)" class="orb-purple" opacity="0.3"/>
  <circle cx="600" cy="370" r="120" fill="#ec4899" filter="url(#glowPurple)" class="orb-pink" opacity="0.2"/>

  <!-- Subtle Dynamic 3D Point Cloud Wireframe Matrix in Background -->
  <g class="cloud-dots" fill="#38bdf8">
    <!-- Point Cloud Cluster Left -->
    <circle cx="80" cy="80" r="2.5" opacity="0.6"/>
    <circle cx="120" cy="65" r="1.8" opacity="0.4"/>
    <circle cx="150" cy="100" r="3" opacity="0.7"/>
    <circle cx="190" cy="70" r="2" opacity="0.5"/>
    <circle cx="130" cy="140" r="2.2" opacity="0.6"/>
    <circle cx="90" cy="180" r="1.5" opacity="0.4"/>
    <circle cx="160" cy="190" r="2.5" opacity="0.5"/>
    <circle cx="210" cy="150" r="3.2" opacity="0.8"/>
    <circle cx="240" cy="110" r="2.2" opacity="0.6"/>
    <circle cx="270" cy="160" r="1.8" opacity="0.4"/>
    <!-- Connecting Vector Rays -->
    <path d="M 80 80 L 150 100 L 210 150 L 130 140 Z" stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.2"/>
    <path d="M 120 65 L 190 70 L 240 110 L 150 100 Z" stroke="#818cf8" stroke-width="0.8" fill="none" opacity="0.2"/>
  </g>

  <g class="cloud-dots" fill="#c084fc" style="animation-delay: 2s;">
    <!-- Point Cloud Cluster Right -->
    <circle cx="980" cy="90" r="2.5" opacity="0.5"/>
    <circle cx="1030" cy="70" r="3" opacity="0.7"/>
    <circle cx="1080" cy="110" r="2" opacity="0.6"/>
    <circle cx="1120" cy="80" r="1.8" opacity="0.4"/>
    <circle cx="1050" cy="140" r="3.2" opacity="0.8"/>
    <circle cx="1000" cy="180" r="2.2" opacity="0.6"/>
    <circle cx="1110" cy="170" r="2.5" opacity="0.5"/>
    <circle cx="1140" cy="130" r="1.5" opacity="0.4"/>
    <!-- Connecting Vector Rays -->
    <path d="M 980 90 L 1030 70 L 1050 140 L 1000 180 Z" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.2"/>
    <path d="M 1030 70 L 1080 110 L 1110 170 L 1050 140 Z" stroke="#f472b6" stroke-width="0.8" fill="none" opacity="0.2"/>
  </g>

  <!-- Flow connecting dashes (Dynamic) -->
  <path d="M 100 210 C 300 240, 450 180, 600 210 C 750 240, 900 180, 1100 210" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.25" class="flow-line"/>

  <!-- Foreground Title and Core Branding (Always in Crystal Clear Foreground) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 52)">
      <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="-160" cy="0" r="5" fill="#38bdf8" class="tag-shimmer"/>
      <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">STATE-OF-THE-ART SPATIAL AI ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome 3D Point Cloud Diffusion
    </text>
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.3">
      &amp; Generative 3D
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="url(#subGrad)" letter-spacing="0.2">
      Diffusion Transformers • 3D Gaussian Splatting (3DGS) • Monocular Pointmaps • LiDAR &amp; NeRF
    </text>

    <!-- Dynamic Category Indicator Cards (Floating Cleanly in Dedicated Bottom Zone) -->
    <g id="bottom-pills" transform="translate(0, 245)">
      <!-- Pill 1: Point Cloud DiT -->
      <g class="card-1" transform="translate(90, 0)">
        <rect width="230" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="28" cy="26" r="10" fill="#0369a1"/>
        <text x="28" y="30" text-anchor="middle" font-size="12" fill="#38bdf8">⚡</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Point Cloud DiT</text>
        <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Point-E • PointDiT • LION</text>
      </g>

      <!-- Pill 2: 3D Gaussian Splats -->
      <g class="card-2" transform="translate(345, 0)">
        <rect width="245" height="52" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="28" cy="26" r="10" fill="#4338ca"/>
        <text x="28" y="30" text-anchor="middle" font-size="12" fill="#818cf8">🔮</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">3D Gaussian Splatting</text>
        <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">3DGS • gsplat • SuperSplat</text>
      </g>

      <!-- Pill 3: Metric Pointmaps -->
      <g class="card-3" transform="translate(615, 0)">
        <rect width="245" height="52" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="28" cy="26" r="10" fill="#7e22ce"/>
        <text x="28" y="30" text-anchor="middle" font-size="12" fill="#c084fc">📐</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Metric Pointmaps &amp; Depth</text>
        <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">DUSt3R • MASt3R • Depth Pro</text>
      </g>

      <!-- Pill 4: Large-scale LiDAR -->
      <g class="card-4" transform="translate(885, 0)">
        <rect width="225" height="52" rx="12" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="28" cy="26" r="10" fill="#be185d"/>
        <text x="28" y="30" text-anchor="middle" font-size="12" fill="#f472b6">🌐</text>
        <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">LiDAR &amp; Reality Capture</text>
        <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Open3D • PCL • Potree • Cintoo</text>
      </g>
    </g>

    <!-- Metric Counter Footer Bar -->
    <g transform="translate(600, 350)">
      <rect x="-380" y="-18" width="760" height="36" rx="18" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="-250" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        🌟 <tspan fill="#38bdf8" font-weight="800">30+</tspan> Open-Source Repos
      </text>
      <circle cx="-135" cy="0" r="3" fill="#475569"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        🏢 <tspan fill="#818cf8" font-weight="800">9+</tspan> SaaS Platforms
      </text>
      <circle cx="135" cy="0" r="3" fill="#475569"/>
      <text x="250" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
        🚀 <tspan fill="#c084fc" font-weight="800">100K+</tspan> Combined Stars
      </text>
    </g>
  </g>
</svg>
